name: "Check upstream updates"

on:
    schedule:
        - cron: "0 1 * * *"
    workflow_dispatch:

jobs:
    generate-matrix:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Generate matrix
              id: gen-matrix
              run: |
                  list=$(for d in */; do p=${d%/}; [[ -f "$p/PKGBUILD" ]] && echo "$p"; done | jq -R . | jq -cs .)
                  echo "packages=$list" >> "$GITHUB_OUTPUT"
        outputs:
            packages: ${{ steps.gen-matrix.outputs.packages }}

    check:
        runs-on: ubuntu-latest
        needs: generate-matrix
        strategy:
            fail-fast: false
            matrix:
                pkgname: ${{ fromJson(needs.generate-matrix.outputs.packages) }}
        steps:
            - uses: actions/checkout@v4

            - name: Install nvchecker
              run: pipx install nvchecker

            - name: Detect upstream version
              id: detect
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  printf '[keys]\ngithub = "%s"\n' "$GITHUB_TOKEN" > /tmp/nv-keyfile.toml
                  current=$(bash -c 'source ${{ matrix.pkgname }}/PKGBUILD >/dev/null 2>&1; printf "%s" "$pkgver"')
                  latest=$(nvchecker -c nvchecker.toml -k /tmp/nv-keyfile.toml \
                      -e ${{ matrix.pkgname }} --logger json \
                      | jq -r 'select(.event=="updated") | .version')
                  rm -f /tmp/nv-keyfile.toml
                  if [[ -z "$latest" ]]; then
                      echo "::error::nvchecker returned no version for ${{ matrix.pkgname }}"
                      exit 1
                  fi
                  if [[ ! "$latest" =~ ^[A-Za-z0-9._+]+$ ]]; then
                      echo "::error::suspicious version string: $latest"
                      exit 1
                  fi
                  echo "current=$current latest=$latest"
                  update=false
                  if [[ "$latest" != "$current" && \
                      "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n1)" == "$latest" ]]; then
                      update=true
                  fi
                  echo "update=$update" >> "$GITHUB_OUTPUT"
                  echo "version=$latest" >> "$GITHUB_OUTPUT"

            - name: Bump PKGBUILD
              if: ${{ steps.detect.outputs.update == 'true' }}
              env:
                  NEW_VERSION: ${{ steps.detect.outputs.version }}
              run: |
                  docker run --rm \
                    -e HOST_UID="$(id -u)" \
                    -e HOST_GID="$(id -g)" \
                    -e PKG="${{ matrix.pkgname }}" \
                    -e NEW_VERSION="$NEW_VERSION" \
                    -v "$PWD:/workspace" \
                    archlinux:base-devel \
                    bash -lc '
                      set -euo pipefail
                      pacman-key --init
                      pacman --noconfirm -Syu --needed pacman-contrib
                      if ! getent group "$HOST_GID" > /dev/null; then
                        groupadd -g "$HOST_GID" build
                      fi
                      useradd -m -u "$HOST_UID" -g "$HOST_GID" build
                      cd /workspace
                      runuser -u build -- ./bump.sh "$PKG" "$NEW_VERSION"
                    '

            - name: Create pull request
              id: cpr
              if: ${{ steps.detect.outputs.update == 'true' }}
              uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
              with:
                  token: ${{ secrets.PR_TOKEN }}
                  add-paths: ${{ matrix.pkgname }}/PKGBUILD
                  branch: update/${{ matrix.pkgname }}
                  delete-branch: true
                  commit-message: "${{ matrix.pkgname }}: update to ${{ steps.detect.outputs.version }}-1"
                  title: "${{ matrix.pkgname }}: update to ${{ steps.detect.outputs.version }}-1"
                  body: |
                      Automated update detected by nvchecker.

                      - Package: `${{ matrix.pkgname }}`
                      - New upstream version: `${{ steps.detect.outputs.version }}`
                      - Checksums refreshed with `updpkgsums`

                      Merging this PR triggers the existing build-and-push-to-AUR pipeline.

            - name: Record PR for digest
              if: ${{ steps.detect.outputs.update == 'true' && steps.cpr.outputs.pull-request-number }}
              env:
                  PKG: ${{ matrix.pkgname }}
                  VERSION: ${{ steps.detect.outputs.version }}
                  PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
                  PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
              run: |
                  mkdir -p digest
                  printf -- '- [ ] `%s` → `%s-1` (#%s) %s\n' \
                      "$PKG" "$VERSION" "$PR_NUMBER" "$PR_URL" > "digest/${PKG}.md"

            - name: Upload digest entry
              if: ${{ steps.detect.outputs.update == 'true' && steps.cpr.outputs.pull-request-number }}
              uses: actions/upload-artifact@v4
              with:
                  name: digest-${{ matrix.pkgname }}
                  path: digest/${{ matrix.pkgname }}.md
                  retention-days: 1

    notify:
        runs-on: ubuntu-latest
        needs: check
        if: ${{ always() }}
        permissions:
            issues: write
        steps:
            - name: Download digest entries
              uses: actions/download-artifact@v4
              with:
                  path: digest
                  pattern: digest-*
                  merge-multiple: true

            - name: Open or update digest issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  entries=(digest/*.md)
                  if [[ ${#entries[@]} -eq 0 ]]; then
                      echo "No updates this run; nothing to notify."
                      exit 0
                  fi

                  today=$(date -u +%Y-%m-%d)
                  title="Upstream updates ($today)"
                  {
                      echo "nvchecker found upstream updates and opened PRs. Merge each to push to AUR."
                      echo
                      cat digest/*.md | sort
                      echo
                      echo "_[workflow run]($RUN_URL)_"
                  } > body.md

                  gh label create automated-update --color 0e8a16 \
                      --description "Automated upstream update digest" 2>/dev/null || true
                  gh issue create --title "$title" --body-file body.md --label automated-update
