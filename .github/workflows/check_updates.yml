name: "Check upstream updates"

on:
    schedule:
        - cron: "0 1 * * *"
    workflow_dispatch:

jobs:
    generate-matrix:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Generate matrix
              id: gen-matrix
              run: |
                  list=$(for d in */; do p=${d%/}; [[ -f "$p/PKGBUILD" ]] && echo "$p"; done | jq -R . | jq -cs .)
                  echo "packages=$list" >> "$GITHUB_OUTPUT"
        outputs:
            packages: ${{ steps.gen-matrix.outputs.packages }}

    check:
        runs-on: ubuntu-latest
        needs: generate-matrix
        strategy:
            fail-fast: false
            matrix:
                pkgname: ${{ fromJson(needs.generate-matrix.outputs.packages) }}
        steps:
            - uses: actions/checkout@v4

            - name: Install nvchecker
              run: pipx install nvchecker

            - name: Detect upstream version
              id: detect
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  printf '[keys]\ngithub = "%s"\n' "$GITHUB_TOKEN" > /tmp/nv-keyfile.toml
                  current=$(bash -c 'source ${{ matrix.pkgname }}/PKGBUILD >/dev/null 2>&1; printf "%s" "$pkgver"')
                  latest=$(nvchecker -c nvchecker.toml -k /tmp/nv-keyfile.toml \
                      -e ${{ matrix.pkgname }} --logger json \
                      | jq -r 'select(.event=="updated") | .version')
                  rm -f /tmp/nv-keyfile.toml
                  if [[ -z "$latest" ]]; then
                      echo "::error::nvchecker returned no version for ${{ matrix.pkgname }}"
                      exit 1
                  fi
                  if [[ ! "$latest" =~ ^[A-Za-z0-9._+]+$ ]]; then
                      echo "::error::suspicious version string: $latest"
                      exit 1
                  fi
                  echo "current=$current latest=$latest"
                  update=false
                  if [[ "$latest" != "$current" && \
                      "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n1)" == "$latest" ]]; then
                      update=true
                  fi
                  echo "update=$update" >> "$GITHUB_OUTPUT"
                  echo "version=$latest" >> "$GITHUB_OUTPUT"

            - name: Bump PKGBUILD
              if: ${{ steps.detect.outputs.update == 'true' }}
              env:
                  NEW_VERSION: ${{ steps.detect.outputs.version }}
              run: |
                  docker run --rm \
                    -e HOST_UID="$(id -u)" \
                    -e HOST_GID="$(id -g)" \
                    -e PKG="${{ matrix.pkgname }}" \
                    -e NEW_VERSION="$NEW_VERSION" \
                    -v "$PWD:/workspace" \
                    archlinux:base-devel \
                    bash -lc '
                      set -euo pipefail
                      pacman-key --init
                      pacman --noconfirm -Syu --needed pacman-contrib
                      if ! getent group "$HOST_GID" > /dev/null; then
                        groupadd -g "$HOST_GID" build
                      fi
                      useradd -m -u "$HOST_UID" -g "$HOST_GID" build
                      cd /workspace
                      runuser -u build -- ./bump.sh "$PKG" "$NEW_VERSION"
                    '

            - name: Create pull request
              if: ${{ steps.detect.outputs.update == 'true' }}
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.PR_TOKEN }}
                  add-paths: ${{ matrix.pkgname }}/PKGBUILD
                  branch: update/${{ matrix.pkgname }}
                  delete-branch: true
                  commit-message: "${{ matrix.pkgname }}: update to ${{ steps.detect.outputs.version }}-1"
                  title: "${{ matrix.pkgname }}: update to ${{ steps.detect.outputs.version }}-1"
                  body: |
                      Automated update detected by nvchecker.

                      - Package: `${{ matrix.pkgname }}`
                      - New upstream version: `${{ steps.detect.outputs.version }}`
                      - Checksums refreshed with `updpkgsums`

                      Merging this PR triggers the existing build-and-push-to-AUR pipeline.
